# Arquitetura BRAZUG (Armory) usando DB externo
# Uso: docker compose up -d

services:
  armory:
    build: ./brazug-armory
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
